<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>J-WIN · Administration</title>
<style>
:root{--bl:#2563eb;--bl2:#1d4ed8;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--ok:#16a34a;--red:#dc2626;--card:#fff}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}a{color:var(--bl2)}
.login{max-width:380px;margin:12vh auto;background:var(--card);padding:28px;border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.1);display:grid;gap:14px}
.login h1{margin:0;font-size:1.5rem}.in{width:100%;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.btn{border:0;border-radius:999px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;background:var(--bl);color:#fff}.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ok{background:var(--ok)}.btn.no{background:var(--red)}.btn.sm{padding:.3rem .8rem;font-size:.85rem}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:#0b1b45;color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav h2{margin:0 8px 14px;font-size:1.2rem}nav button{background:none;border:0;color:#cbd5f5;text-align:left;padding:.6rem .8rem;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
nav button.on,nav button:hover{background:var(--bl);color:#fff}nav .n{background:#f59e0b;color:#111;border-radius:999px;padding:0 .5rem;font-size:.75rem;font-weight:800}nav .sp{flex:1}
main{padding:22px;max-width:1200px;width:100%}h1.t{margin:0 0 16px;font-size:1.5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--line)}.k small{color:var(--mut);display:block}.k b{font-size:1.5rem}.k.warn{border-color:#f59e0b;background:#fffbeb}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;overflow:auto}.box h3{margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;color:var(--mut);font-weight:700;padding:.4rem .5rem;border-bottom:1.5px solid var(--line);white-space:nowrap}td{padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}
.chip{display:inline-block;padding:.1rem .55rem;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:.78rem;font-weight:700}.chip.ok{background:#dcfce7;color:#166534}.chip.no{background:#fee2e2;color:#991b1b}.chip.w{background:#fef3c7;color:#92400e}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bars i{flex:1;background:var(--bl);border-radius:3px 3px 0 0;min-height:2px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tb .in{width:auto;min-width:150px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{display:grid;gap:4px;margin-bottom:10px}.f label{font-weight:700;font-size:.85rem}
dialog{border:0;border-radius:20px;padding:20px;width:min(720px,94vw);max-height:90vh}dialog::backdrop{background:rgba(15,23,42,.55)}
.imgs img{width:70px;height:70px;object-fit:cover;border-radius:10px;margin-right:6px}.err{color:var(--red);min-height:1.2em}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.7rem 1.2rem;border-radius:999px;z-index:99}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow:auto;padding:8px}nav h2,nav .sp{display:none}nav button{white-space:nowrap}.grid2{grid-template-columns:1fr}main{padding:14px}}
</style></head><body>
<div id="root"></div><div class="toast" id="toast" hidden></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n||0)).replace(/[\u202f\u00a0]/g,' ')+' F';
const dt=t=>t?new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
let TOKEN=sessionStorage.getItem('jw-admin'),TAB='dash';
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}
async function api(p,o={}){
  const r=await fetch('/api/admin'+p,{method:o.method||(o.body?'POST':'GET'),headers:{Authorization:'Bearer '+TOKEN,...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});
  if(r.status===401&&p!=='/login'){sessionStorage.removeItem('jw-admin');TOKEN=null;render();throw new Error('Session expirée')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur '+r.status);return j;
}
const act=async(fn,ok)=>{try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message)}};
async function login(){root.innerHTML=`<form class="login" id="fl"><h1>J-WIN · Administration</h1><p style="color:var(--mut);margin:0">Espace réservé à l'administrateur.</p><input class="in" id="pw" type="password" placeholder="Mot de passe administrateur" autocomplete="current-password" autofocus><p class="err" id="er"></p><button class="btn">Se connecter</button></form>`;
  try{const r=await fetch('/api/admin/status');const j=await r.json();if(j.dbWritable===false)$('#er').textContent='Attention : la base de données n\'est pas accessible en écriture. Vérifiez le disque persistant sur Render (Disks) et les Logs.';if(!j.enabled)$('#er').textContent='La console est désactivée : ajoutez la variable ADMIN_PASSWORD dans Render (Environment), enregistrez, puis attendez le redémarrage.'}
  catch(e){$('#er').textContent='Le serveur ne répond pas comme prévu (version ancienne ou démarrage en cours). Patientez une minute, puis rechargez la page.'}
  $('#fl').onsubmit=async e=>{e.preventDefault();$('#er').textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(_){}if(!r.ok)throw new Error(j.error?(j.error+(r.status>=500?' (code '+r.status+' : consultez les Logs du service sur Render)':'')):'Réponse inattendue du serveur (code '+r.status+'). La dernière version n\'est probablement pas déployée.');TOKEN=j.token;sessionStorage.setItem('jw-admin',TOKEN);render()}catch(x){$('#er').textContent=x.message}}}
const TABS=[['dash','Tableau de bord'],['queue','À traiter'],['users','Utilisateurs'],['missions','Missions'],['payments','Dépôts et retraits'],['ledger','Transactions'],['settings','Réglages du site'],['exports','Exports et sauvegarde'],['system','Système et journal']];
async function render(){
  if(!TOKEN)return login();
  let n=0;try{const s=await api('/stats');n=s.queue.missions+s.queue.deposits+s.queue.withdrawals}catch(e){if(!TOKEN)return}
  root.innerHTML=`<div class="app"><nav><h2>🔷 J-WIN Admin</h2>${TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===TAB?'on':''}">${t[1]}${t[0]==='queue'&&n?`<span class="n">${n}</span>`:''}</button>`).join('')}<span class="sp"></span><button id="out">Se déconnecter</button></nav><main id="main"></main></div>`;
  document.querySelectorAll('nav [data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render()});$('#out').onclick=()=>{sessionStorage.removeItem('jw-admin');TOKEN=null;render()};
  await V[TAB]($('#main'));
}
const table=(cols,rows,empty='Aucun résultat.')=>rows.length?`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:`<p style="color:var(--mut)">${empty}</p>`;
const st=s=>({SUCCESS:['ok','Validé'],FAILED:['no','Refusé'],PENDING_ADMIN:['w','À traiter'],PENDING:['w','En cours'],approved:['ok','Approuvée'],pending:['w','À approuver'],rejetee:['no','Refusée'],none:['','Non vérifiée'],verified:['ok','Vérifiée'],rejected:['no','Refusée'],attente:['','Disponible'],cours:['w','En cours'],terminee:['w','Terminée'],payee:['ok','Payée'],annulee:['no','Annulée']}[s]||['',s]);
const chip=s=>{const [c,l]=st(s);return `<span class="chip ${c}">${l}</span>`};
const bars=(a)=>{const m=Math.max(1,...a.map(x=>x.v));return `<div class="bars">${a.map(x=>`<i title="${x.day} : ${x.v}" style="height:${x.v/m*100}%"></i>`).join('')}</div>`};
const V={};
V.dash=async m=>{const s=await api('/stats');const k=(l,v,w)=>`<div class="k ${w?'warn':''}"><small>${l}</small><b>${v}</b></div>`;
  m.innerHTML=`<h1 class="t">Tableau de bord</h1><div class="cards">${k('Missions à approuver',s.queue.missions,s.queue.missions)}${k('Dépôts à valider',s.queue.deposits,s.queue.deposits)}${k('Retraits à payer',s.queue.withdrawals,s.queue.withdrawals)}${k('Identités à vérifier',s.queue.kyc,s.queue.kyc)}</div>
  <div class="cards">${k('Utilisateurs',s.users.total)}${k('Nouveaux (7 j)',s.users.new7)}${k('Nouveaux (30 j)',s.users.new30)}${k('Suspendus',s.users.suspended)}${k('Missions ouvertes',s.missions.open)}${k('En cours',s.missions.inProgress)}${k('Missions payées',s.missions.paid)}${k('Volume payé',F(s.missions.volume))}</div>
  <div class="cards">${k('Soldes des portefeuilles',F(s.money.walletTotal))}${k('Total déposé',F(s.money.deposited))}${k('Total retiré',F(s.money.withdrawn))}${k('Retraits en attente',F(s.money.withdrawPending))}${k('Commissions J-WIN',F(s.money.fees))}</div>
  <div class="grid2"><div class="box"><h3>Inscriptions (30 jours)</h3>${bars(s.signups)}</div><div class="box"><h3>Volume de missions payées (30 jours)</h3>${bars(s.volume)}</div></div>`};
V.queue=async m=>{const [mi,pa,us]=await Promise.all([api('/missions?mod=pending'),api('/payments?status=PENDING_ADMIN'),api('/users?kyc=pending&limit=50')]);
  m.innerHTML=`<h1 class="t">À traiter</h1><div class="box"><h3>Missions à approuver (${mi.rows.filter(x=>x.status!=='annulee').length})</h3>${missionsTable(mi.rows.filter(x=>x.status!=='annulee'))}</div><div class="box"><h3>Dépôts et retraits (${pa.rows.length})</h3>${paymentsTable(pa.rows)}</div><div class="box"><h3>Identités à vérifier (${us.total})</h3>${usersTable(us.rows)}</div>`;bind(m)};
const missionsTable=r=>table(['Mission','Par','Lieu','Montant','Médias','Statut',''],r.map(x=>`<tr><td><b>${esc(x.title)}</b><br><small>${esc(x.id)} · ${esc(x.cat)}</small><br><small>${esc((x.descr||'').slice(0,140))}</small></td><td>${esc(x.creator)}<br><small>${esc(x.creator_phone||'')}</small></td><td>${x.mode==='remote'?'À distance':esc(x.city+' '+(x.place||''))}</td><td>${F(x.amount)}<br><small>WIN ${x.win}</small></td><td class="imgs">${x.images.map(i=>`<a href="${i}" target="_blank"><img src="${i}" alt=""></a>`).join('')}${x.audio?`<audio controls preload="none" src="${x.audio}" style="width:150px"></audio>`:''}</td><td>${chip(x.mod==='pending'?'pending':x.mod==='rejetee'?'rejetee':x.status)}${x.executor?`<br><small>Réalisé par ${esc(x.executor)}</small>`:''}</td><td style="white-space:nowrap">${x.mod==='pending'&&x.status!=='annulee'?`<button class="btn ok sm" data-a="mok" data-id="${esc(x.id)}">Approuver</button> <button class="btn no sm" data-a="mno" data-id="${esc(x.id)}">Refuser</button>`:''}${!['payee','annulee'].includes(x.status)?` <button class="btn g sm" data-a="mcx" data-id="${esc(x.id)}">Annuler</button>`:''}</td></tr>`));
const paymentsTable=r=>table(['Date','Client','Type','Montant','Détail','Statut',''],r.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.name||'')}<br><small>${esc(x.uphone||'')}</small></td><td>${x.kind==='recharge'?'Dépôt':'Retrait'}<br><small>${esc(x.ref||'')}</small></td><td>${F(x.amount)}<br><small>frais ${F(x.fee)} · ${x.kind==='recharge'?'à recevoir '+F(x.amount+x.fee):'à envoyer '+F(x.amount-x.fee)}</small></td><td><small>${esc(x.method)} ${esc(x.phone||'')}${x.tx_id?'<br>Trans. '+esc(x.tx_id):''}${x.error?'<br>'+esc(x.error):''}</small></td><td>${chip(x.status)}</td><td style="white-space:nowrap">${x.status==='PENDING_ADMIN'?`<button class="btn ok sm" data-a="pok" data-id="${esc(x.id)}">${x.kind==='recharge'?'Valider':'J\'ai payé'}</button> <button class="btn no sm" data-a="pno" data-id="${esc(x.id)}">Refuser</button>`:''}</td></tr>`));
const usersTable=r=>table(['Utilisateur','Contact','Identité','Solde','Missions','Inscrit',''],r.map(u=>`<tr><td><b>${esc(u.prenoms)} ${esc(u.nom)}</b> ${u.status==='suspended'?'<span class="chip no">Suspendu</span>':''}<br><small>${esc(u.id)}</small></td><td>${esc(u.phone||'')}<br><small>${esc(u.email||'')}</small></td><td>${chip(u.kyc_status)}</td><td>${F(u.balance)}</td><td>${u.created} créées<br>${u.done} réalisées</td><td>${dt(u.created_at)}</td><td><button class="btn g sm" data-a="user" data-id="${esc(u.id)}">Gérer</button></td></tr>`));
function bind(m){m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a,id=b.dataset.id,enc=encodeURIComponent(id);
  if(a==='user')return userDlg(id);
  const note=(a==='mno'||a==='pno')?prompt('Motif (facultatif, transmis à l\'utilisateur) :')??null:'';if(note===null)return;
  if(a==='mcx'&&!confirm('Annuler cette mission ?'))return;
  if(a==='pok'&&!confirm('Confirmez : la réception (dépôt) ou l\'envoi (retrait) est bien effectué ?'))return;
  const map={mok:['/missions/'+enc+'/approve'],mno:['/missions/'+enc+'/reject'],mcx:['/missions/'+enc+'/cancel'],pok:['/payments/'+enc+'/approve'],pno:['/payments/'+enc+'/reject']}[a];
  await act(()=>api(map[0],{body:{note}}),'Fait. L\'utilisateur est prévenu.');render()})}
V.users=async m=>{m.innerHTML=`<h1 class="t">Utilisateurs</h1><div class="tb"><input class="in" id="q" placeholder="Nom, téléphone, e-mail, identifiant"><select class="in" id="k"><option value="">Toutes identités</option><option value="none">Non vérifiées</option><option value="pending">À vérifier</option><option value="verified">Vérifiées</option><option value="rejected">Refusées</option></select><select class="in" id="s"><option value="">Tous statuts</option><option value="suspended">Suspendus</option></select><button class="btn" id="go">Rechercher</button></div><div class="box" id="res"></div>`;
  const load=async()=>{const r=await api(`/users?q=${encodeURIComponent($('#q').value)}&kyc=${$('#k').value}&status=${$('#s').value}`);$('#res').innerHTML=`<p style="color:var(--mut)">${r.total} résultat(s)</p>`+usersTable(r.rows);bind($('#res'))};$('#go').onclick=load;$('#q').onkeydown=e=>e.key==='Enter'&&load();load()};
async function userDlg(id){const d=await api('/users/'+encodeURIComponent(id)),u=d.user,dlg=$('#dlg');
  dlg.innerHTML=`<h2 style="margin-top:0">${esc(u.prenoms)} ${esc(u.nom)} ${chip(u.kyc_status)} ${u.status==='suspended'?'<span class="chip no">Suspendu</span>':''}</h2><p>${esc(u.phone||'')} · ${esc(u.email||'')} · né(e) le ${esc(u.dob||'')}<br>${esc(u.adresse||'')} · pièce ${esc(u.kyc_doc_type||'?')} (fin ${esc(u.kyc_doc_last4||'???')}) · inscrit le ${dt(u.created_at)}<br><b>Solde : ${F(u.balance)}</b></p>
  ${d.kyc?`<div class="box"><h3>Pièces envoyées le ${dt(d.kyc.submitted_at)}</h3><p>Type : ${esc(d.kyc.type)} · lu sur la pièce : ${esc([d.kyc.ocr.nom,d.kyc.ocr.prenoms,d.kyc.ocr.dob].filter(Boolean).join(' ')||'non lu')}</p><div class="tb"><button class="btn g sm" data-doc="front">Voir le recto</button>${d.kyc.b?'<button class="btn g sm" data-doc="back">Voir le verso</button>':''}<button class="btn g sm" data-doc="selfie">Voir le selfie</button></div><div id="docv"></div></div>`:''}
  <div class="tb"><button class="btn ${u.status==='suspended'?'ok':'no'} sm" id="susp">${u.status==='suspended'?'Réactiver le compte':'Suspendre le compte'}</button><select class="in" id="kyc"><option value="">Identité…</option><option value="verified">Marquer vérifiée</option><option value="rejected">Refuser</option><option value="pending">Remettre à vérifier</option></select><button class="btn g sm" id="pwr">Réinitialiser le mot de passe</button></div>
  <div class="box"><h3>Ajuster le portefeuille</h3><div class="tb"><input class="in" id="am" placeholder="Montant (+ crédit, − débit)"><input class="in" id="mm" placeholder="Motif (obligatoire)" style="flex:1"><button class="btn sm" id="adj">Appliquer</button></div></div>
  <h3>Missions</h3>${table(['Mission','Rôle','Montant','Statut'],d.missions.map(x=>`<tr><td>${esc(x.title)}<br><small>${esc(x.id)}</small></td><td>${x.creator_id===u.id?'Donneur':'Réalisateur'}</td><td>${F(x.amount)}</td><td>${chip(x.mod==='pending'?'pending':x.status)}</td></tr>`))}
  <h3>Mouvements</h3>${table(['Date','Type','Montant','Détail'],d.ledger.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.kind)}</td><td style="color:${x.amount<0?'var(--red)':'var(--ok)'}">${x.amount>0?'+':''}${F(x.amount)}</td><td>${esc(x.memo||'')}</td></tr>`))}<p style="text-align:right"><button class="btn g" onclick="$('#dlg').close()">Fermer</button></p>`;dlg.showModal();
  dlg.querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{const r=await fetch('/api/admin/kyc/'+encodeURIComponent(id)+'/'+b.dataset.doc,{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)return toast('Fichier introuvable');$('#docv').innerHTML='<img src="'+URL.createObjectURL(await r.blob())+'" style="max-width:100%;border-radius:12px;margin-top:8px" alt="Pièce">'});
  $('#susp').onclick=async()=>{if(u.status!=='suspended'&&!confirm('Suspendre ce compte ? Il ne pourra plus se connecter.'))return;await act(()=>api(`/users/${encodeURIComponent(id)}/status`,{body:{status:u.status==='suspended'?'active':'suspended'}}),'Statut mis à jour.');dlg.close();render()};
  $('#kyc').onchange=async e=>{if(!e.target.value)return;await act(()=>api(`/users/${encodeURIComponent(id)}/kyc`,{body:{status:e.target.value}}),'Identité mise à jour.');dlg.close();render()};
  $('#pwr').onclick=async()=>{if(!confirm('Générer un mot de passe temporaire ?'))return;const r=await act(()=>api(`/users/${encodeURIComponent(id)}/reset-password`,{method:'POST',body:{}}));if(r)prompt('Mot de passe temporaire (à transmettre à l\'utilisateur) :',r.temporaryPassword)};
  $('#adj').onclick=async()=>{const r=await act(()=>api(`/users/${encodeURIComponent(id)}/adjust`,{body:{amount:Number($('#am').value.replace(/\s/g,'')),memo:$('#mm').value}}),'Portefeuille ajusté.');if(r){dlg.close();userDlg(id)}}}
V.missions=async m=>{m.innerHTML=`<h1 class="t">Missions</h1><div class="tb"><input class="in" id="q" placeholder="Titre, référence, ville"><select class="in" id="mod"><option value="">Toutes</option><option value="pending">À approuver</option><option value="approved">Approuvées</option><option value="rejetee">Refusées</option></select><select class="in" id="stt"><option value="">Tous statuts</option><option value="attente">Disponibles</option><option value="cours">En cours</option><option value="terminee">Terminées</option><option value="payee">Payées</option><option value="annulee">Annulées</option></select><button class="btn" id="go">Filtrer</button></div><div class="box" id="res"></div>`;
  const load=async()=>{const r=await api(`/missions?q=${encodeURIComponent($('#q').value)}&mod=${$('#mod').value}&status=${$('#stt').value}`);$('#res').innerHTML=missionsTable(r.rows);bind($('#res'))};$('#go').onclick=load;load()};
V.payments=async m=>{m.innerHTML=`<h1 class="t">Dépôts et retraits</h1><div class="tb"><select class="in" id="kd"><option value="">Tous</option><option value="recharge">Dépôts</option><option value="withdraw">Retraits</option></select><select class="in" id="ss"><option value="">Tous statuts</option><option value="PENDING_ADMIN">À traiter</option><option value="SUCCESS">Validés</option><option value="FAILED">Refusés</option></select><button class="btn" id="go">Filtrer</button></div><div class="box" id="res"></div>`;
  const load=async()=>{const r=await api(`/payments?kind=${$('#kd').value}&status=${$('#ss').value}`);$('#res').innerHTML=paymentsTable(r.rows);bind($('#res'))};$('#go').onclick=load;load()};
V.ledger=async m=>{const [l,i]=await Promise.all([api('/ledger?limit=300'),api('/invoices')]);
  m.innerHTML=`<h1 class="t">Transactions</h1><div class="box"><h3>Mouvements de portefeuille</h3>${table(['Date','Utilisateur','Type','Montant','Détail','Facture'],l.rows.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.name||'')}</td><td>${esc(x.kind)}</td><td style="color:${x.amount<0?'var(--red)':'var(--ok)'}">${x.amount>0?'+':''}${F(x.amount)}</td><td>${esc(x.memo||'')}</td><td>${esc(x.invoice_no||'')}</td></tr>`))}</div><div class="box"><h3>Factures émises</h3>${table(['N°','Date','Client','Libellé','Frais','Total'],i.rows.map(x=>`<tr><td>${esc(x.no)}</td><td>${dt(x.at)}</td><td>${esc(x.customer||'')}</td><td>${esc(x.label)}</td><td>${F(x.fee)}</td><td>${F(x.total)}</td></tr>`))}</div>`};
V.settings=async m=>{const s=await api('/settings'),v=s.values;const inp=(k,l,t='text',h='')=>`<div class="f"><label>${l}</label><input class="in" data-k="${k}" type="${t}" value="${esc(v[k])}">${h?`<small style="color:var(--mut)">${h}</small>`:''}</div>`;
  m.innerHTML=`<h1 class="t">Réglages du site</h1><p style="color:var(--mut)">Ces réglages s'appliquent immédiatement, sans redéployer.</p><div class="grid2"><div class="box"><h3>Annonce et maintenance</h3><div class="f"><label>Bandeau d'annonce (affiché en haut de l'application)</label><textarea class="in" data-k="banner" rows="3">${esc(v.banner)}</textarea><small style="color:var(--mut)">Laissez vide pour le retirer.</small></div><label><input type="checkbox" data-k="maintenance" ${v.maintenance?'checked':''}> Mode maintenance (bloque l'application, la console reste accessible)</label></div>
  <div class="box"><h3>Frais et limites</h3>${inp('fees.recharge','Frais de dépôt (%)','number')}${inp('fees.withdraw','Frais de retrait (%)','number')}${inp('fees.mission','Commission sur mission (%)','number')}${inp('plan.create','Offre Standard : missions créées / période','number')}${inp('plan.do','Offre Standard : missions réalisées / période','number')}${inp('plan.unverified','Sans vérification d\'identité : missions créées et réalisées (maximum)','number')}${inp('limits.rechargeMin','Dépôt minimum (F)','number')}${inp('limits.withdrawMin','Retrait minimum (F)','number')}</div>
  <div class="box"><h3>Contacts et paiements</h3>${inp('adminOm','Numéro Orange Money des dépôts')}${inp('adminEmail','E-mail administrateur (reçoit les alertes)')}${inp('adminPhone','Téléphone administrateur (alertes SMS)')}${inp('company.contact','Contact affiché sur les factures')}<div class="f"><label>Mode de paiement</label><select class="in" data-k="paymentMode"><option value="manual" ${v.paymentMode==='manual'?'selected':''}>Manuel (validation par l'administrateur)</option><option value="cinetpay" ${v.paymentMode==='cinetpay'?'selected':''}>Automatique (CinetPay)</option></select></div><div class="f"><label>Vérification d'identité</label><select class="in" data-k="kycMode"><option value="auto" ${v.kycMode==='auto'?'selected':''}>Automatique à l'inscription</option><option value="manual" ${v.kycMode==='manual'?'selected':''}>Validation manuelle par l'administrateur</option></select></div></div>
  <div class="box"><h3>Message à tous les utilisateurs (e-mail)</h3><div class="f"><label>Objet</label><input class="in" id="bs"></div><div class="f"><label>Message</label><textarea class="in" id="bt" rows="5"></textarea></div><button class="btn g" id="bc">Envoyer à tous</button></div></div><button class="btn" id="save">Enregistrer les réglages</button>`;
  $('#save').onclick=async()=>{const b={};m.querySelectorAll('[data-k]').forEach(e=>{b[e.dataset.k]=e.type==='checkbox'?e.checked:e.value});await act(()=>api('/settings',{method:'PUT',body:b}),'Réglages enregistrés.')};
  $('#bc').onclick=async()=>{if(!confirm('Envoyer ce message à tous les utilisateurs actifs ?'))return;const r=await act(()=>api('/broadcast',{body:{subject:$('#bs').value,text:$('#bt').value}}));if(r)toast('Envoi en cours à '+r.recipients+' utilisateur(s).')}};
V.exports=async m=>{const ex=[['users','Utilisateurs'],['missions','Missions'],['ledger','Mouvements de portefeuille'],['payments','Dépôts et retraits'],['invoices','Factures'],['audit','Journal d\'audit']];
  m.innerHTML=`<h1 class="t">Exports et sauvegarde</h1><div class="box"><h3>Extractions (CSV, s'ouvre dans Excel)</h3><div class="tb"><label>Du <input class="in" type="date" id="d1"></label><label>Au <input class="in" type="date" id="d2"></label></div>${table(['Données',''],ex.map(e=>`<tr><td>${e[1]}</td><td><button class="btn sm" data-x="${e[0]}">Télécharger</button></td></tr>`))}</div><div class="box"><h3>Sauvegarde complète</h3><p>Copie de toute la base (comptes, portefeuilles, missions, factures). À faire régulièrement et à conserver hors du serveur.</p><button class="btn" id="bk">Télécharger la sauvegarde (.db)</button></div>`;
  const dl=async(p,name)=>{try{const r=await fetch('/api/admin'+p,{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error((await r.json()).error);const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();toast('Téléchargement lancé.')}catch(e){toast(e.message)}};
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>dl(`/export/${b.dataset.x}?from=${$('#d1').value}&to=${$('#d2').value}`,`jwin-${b.dataset.x}.csv`));$('#bk').onclick=()=>dl('/backup','jwin-sauvegarde.db')};
V.system=async m=>{const [s,a]=await Promise.all([api('/system'),api('/audit')]);const row=(k,v)=>`<tr><td>${k}</td><td>${v}</td></tr>`,yn=b=>b?'<span class="chip ok">Oui</span>':'<span class="chip no">Non</span>';
  m.innerHTML=`<h1 class="t">Système et journal</h1><div class="grid2"><div class="box"><h3>État du serveur</h3><table>${row('Adresse publique',esc(s.publicUrl))}${row('Node',esc(s.node))}${row('En marche depuis (h)',s.uptimeH)}${row('Base de données',(s.dbSize/1048576).toFixed(2)+' Mo')}${row('Écriture en base',s.dbWritable===true?'<span class="chip ok">Oui</span>':'<span class="chip no">Non : '+esc(s.dbWritable)+'</span>')}${row('Fichiers de missions',s.uploads.n+' ('+(s.uploads.size/1048576).toFixed(1)+' Mo)')}${row('Envoi d\'e-mails configuré',yn(s.smtp)+' '+esc(s.smtpUser||''))}${row('SMS',esc(s.sms))}${row('OCR pièce d\'identité',yn(s.ocr))}${row('Paiement',esc(s.paymentMode))}${row('Identité',esc(s.kycMode))}${row('Maintenance',yn(s.maintenance))}</table></div><div class="box"><h3>Tester les envois</h3><div class="f"><label>Envoyer un e-mail de test à</label><input class="in" id="te" value="${esc(s.adminEmail)}"></div><button class="btn sm" id="bte">Envoyer l'e-mail</button><div class="f" style="margin-top:14px"><label>Envoyer un SMS de test au</label><input class="in" id="ts" placeholder="07 00 00 00 00"></div><button class="btn sm" id="bts">Envoyer le SMS</button></div></div><div class="box"><h3>Journal des actions d'administration</h3>${table(['Date','Action','Cible','Détail'],a.rows.map(x=>`<tr><td>${dt(x.at)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td><small>${esc(x.detail)}</small></td></tr>`))}</div>`;
  $('#bte').onclick=async()=>{const r=await act(()=>api('/system/test-email',{body:{to:$('#te').value}}));if(r)toast(r.sent?'E-mail envoyé à '+r.to:'Échec : vérifiez SMTP_USER et SMTP_PASS')};
  $('#bts').onclick=async()=>{const r=await act(()=>api('/system/test-sms',{body:{phone:$('#ts').value}}));if(r)toast(r.sent?'SMS envoyé':'Échec : vérifiez Twilio')}};
render();
</script></body></html>
