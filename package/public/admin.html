<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>J-WIN · Administration</title>
<style>
:root{--bl:#2563eb;--bl2:#1d4ed8;--navy:#0b1740;--navy2:#13235a;--ink:#0f172a;--mut:#64748b;--line:#e5eaf3;--bg:#f3f6fc;--ok:#16a34a;--red:#dc2626;--amb:#d97706;--card:#fff;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--bl2)}h1,h2,h3{margin:0}
.login-wrap{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#dbe6ff,transparent 40%),radial-gradient(circle at 90% 90%,#c7d7ff,transparent 35%),var(--bg);padding:20px}
.login{width:min(400px,100%);background:#fff;padding:32px;border-radius:24px;box-shadow:0 20px 60px rgba(20,40,120,.18);display:grid;gap:14px}
.login .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;color:var(--navy)}.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:grid;place-items:center;color:#fff;font-style:normal}
.in{width:100%;padding:.65rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:.15s}.in:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea.in{resize:vertical}
.btn{border:0;border-radius:12px;padding:.55rem 1.05rem;font-weight:700;cursor:pointer;background:var(--bl);color:#fff;transition:.15s;white-space:nowrap}.btn:hover{background:var(--bl2)}.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.g:hover{border-color:var(--bl);color:var(--bl2)}.btn.ok{background:var(--ok)}.btn.no{background:var(--red)}.btn.sm{padding:.3rem .75rem;font-size:.85rem;border-radius:10px}.btn:disabled{opacity:.5;cursor:default}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow:auto}
nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;margin:2px 8px 16px}nav .brand i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:grid;place-items:center;font-style:normal}
nav .grp{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:#7f93cf;margin:14px 10px 4px}
nav button{background:none;border:0;color:#c9d5f7;text-align:left;padding:.55rem .8rem;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px}nav button span.ic{width:22px;text-align:center}nav button .lbl{flex:1}
nav button.on{background:var(--bl);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.45)}nav button:hover:not(.on){background:rgba(255,255,255,.08)}nav .n{background:#f59e0b;color:#111;border-radius:999px;padding:0 .5rem;font-size:.72rem;font-weight:800}nav .sp{flex:1}
.main{min-width:0}.top{position:sticky;top:0;z-index:5;background:rgba(243,246,252,.9);backdrop-filter:blur(8px);display:flex;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.25rem;flex:1}.top .srch{width:min(340px,40vw)}
.warnbar{background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff;padding:.55rem 1rem;text-align:center;font-weight:700;cursor:pointer}
main{padding:22px 24px 60px;max-width:1300px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.k{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);box-shadow:var(--sh);display:flex;gap:12px;align-items:center}.k .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:#e8efff;flex:none}
.k small{color:var(--mut);display:block;font-size:.8rem}.k b{font-size:1.45rem;line-height:1.2;display:block}.k.act{cursor:pointer}.k.act:hover{border-color:var(--bl)}.k.warn{background:#fffbeb;border-color:#f6c667}.k.warn .ico{background:#fde9b8}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh);overflow:auto}.box h3{margin-bottom:12px;font-size:1.02rem}.box .sub{color:var(--mut);margin:-6px 0 12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;color:var(--mut);font-weight:700;padding:.5rem;border-bottom:1.5px solid var(--line);white-space:nowrap;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:#fff}td{padding:.6rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#f8faff}
.chip{display:inline-block;padding:.1rem .6rem;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:.76rem;font-weight:700;white-space:nowrap}.chip.ok{background:#dcfce7;color:#166534}.chip.no{background:#fee2e2;color:#991b1b}.chip.w{background:#fef3c7;color:#92400e}.chip.gr{background:#eef2f7;color:#475569}
.star{color:#f59e0b;font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}.who{display:flex;gap:10px;align-items:center}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tb .in{width:auto;min-width:150px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.f{display:grid;gap:4px;margin-bottom:10px}.f label{font-weight:700;font-size:.82rem;color:#334155}
.chart{width:100%;height:150px}.legend{display:flex;justify-content:space-between;color:var(--mut);font-size:.78rem}
.funnel{display:grid;gap:8px}.funnel div{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:.85rem}.funnel i{display:block;height:12px;border-radius:99px;background:linear-gradient(90deg,#2563eb,#60a5fa)}
.feed{display:grid;gap:8px;margin:0;padding:0;list-style:none}.feed li{display:flex;gap:10px;align-items:center;padding:.4rem 0;border-bottom:1px dashed var(--line)}.feed small{color:var(--mut);margin-left:auto;white-space:nowrap}
dialog{border:0;border-radius:22px;padding:22px;width:min(820px,95vw);max-height:92vh;box-shadow:0 30px 80px rgba(10,20,60,.35)}dialog::backdrop{background:rgba(11,23,64,.55);backdrop-filter:blur(2px)}
.imgs img{width:78px;height:78px;object-fit:cover;border-radius:12px;margin:0 6px 6px 0}.pf{padding:12px;border-radius:14px;background:#f5f8ff;border:1px solid var(--line);display:grid;gap:8px}
.chat{display:grid;gap:6px;max-height:240px;overflow:auto;padding:8px;background:#f8faff;border-radius:12px}.chat div{max-width:80%;padding:.35rem .7rem;border-radius:14px;background:#fff;border:1px solid var(--line)}.chat small{color:var(--mut);display:block;font-size:.7rem}
.err{color:var(--red);min-height:1.2em;margin:0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.7rem 1.2rem;border-radius:999px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.empty{padding:26px;text-align:center;color:var(--mut)}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow:auto;padding:8px}nav .brand,nav .sp,nav .grp{display:none}nav button{white-space:nowrap}nav button .lbl{flex:none}.grid2,.grid3{grid-template-columns:1fr}main{padding:14px}.top{padding:10px 14px}.top .srch{width:100%}.top{flex-wrap:wrap}}
</style></head><body>
<div id="root"></div><div class="toast" id="toast" hidden></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n||0)).replace(/[\u202f\u00a0]/g,' ')+' F';
const dt=t=>t?new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const ini=n=>String(n||'?').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const stars=r=>r.avg?`<span class="star">★ ${String(r.avg).replace('.',',')}</span> <small>(${r.n})</small>`:'<small style="color:var(--mut)">non noté</small>';
let TOKEN=sessionStorage.getItem('jw-admin'),TAB='dash';
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3800)}
async function api(p,o={}){
  const r=await fetch('/api/admin'+p,{method:o.method||(o.body?'POST':'GET'),headers:{Authorization:'Bearer '+TOKEN,...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined});
  if(r.status===401){sessionStorage.removeItem('jw-admin');TOKEN=null;render();throw new Error('Session expirée')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur '+r.status);return j;
}
const act=async(fn,ok)=>{try{const r=await fn();if(ok)toast(ok);return r||{}}catch(e){toast(e.message)}};
async function login(){root.innerHTML=`<div class="login-wrap"><form class="login" id="fl"><div class="logo"><i>◆</i>J-WIN Administration</div><p style="color:var(--mut);margin:0">Espace réservé à l'administrateur.</p><input class="in" id="us" type="text" placeholder="Nom d'utilisateur" autocomplete="username" autofocus><input class="in" id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password"><p class="err" id="er"></p><button class="btn">Se connecter</button></form></div>`;
  try{const r=await fetch('/api/admin/status');const j=await r.json();if(j.dbWritable===false)$('#er').textContent='Attention : la base de données n\'est pas accessible en écriture. Vérifiez le disque persistant sur Render (Disks) et les Logs.'}
  catch(e){$('#er').textContent='Le serveur ne répond pas comme prévu (version ancienne ou démarrage en cours). Patientez une minute, puis rechargez la page.'}
  $('#fl').onsubmit=async e=>{e.preventDefault();$('#er').textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:$('#us').value,password:$('#pw').value})});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(_){}if(!r.ok)throw new Error(j.error?(j.error+(r.status>=500?' (code '+r.status+' : consultez les Logs du service sur Render)':'')):'Réponse inattendue du serveur (code '+r.status+'). La dernière version n\'est probablement pas déployée.');TOKEN=j.token;sessionStorage.setItem('jw-admin',TOKEN);render()}catch(x){$('#er').textContent=x.message}}}
const NAV=[['Pilotage'],['dash','📊','Tableau de bord'],['queue','⏳','À traiter'],['Communauté'],['users','👥','Utilisateurs'],['missions','📋','Missions'],['reviews','⭐','Avis et modération'],['msgs','✉️','Messages'],['Argent'],['payments','💸','Dépôts et retraits'],['ledger','📒','Transactions'],['Plateforme'],['settings','⚙️','Réglages du site'],['exports','📤','Exports et sauvegarde'],['system','🛠️','Système et journal']];
const TITLES=Object.fromEntries(NAV.filter(x=>x.length>1).map(x=>[x[0],x[2]]));
async function render(){
  if(!TOKEN)return login();
  let n=0,def=false;try{const s=await api('/stats');n=s.queue.missions+s.queue.deposits+s.queue.withdrawals+s.queue.kyc;def=s.defaultCreds}catch(e){if(!TOKEN)return}
  root.innerHTML=(def?`<div class="warnbar" id="wb">⚠ Mot de passe par défaut en cours d'utilisation : accès aux données sensibles bloqué. Cliquez ici pour le changer.</div>`:'')+`<div class="app"><nav><div class="brand"><i>◆</i>J-WIN Admin</div>${NAV.map(x=>x.length===1?`<div class="grp">${x[0]}</div>`:`<button data-t="${x[0]}" class="${x[0]===TAB?'on':''}"><span class="ic">${x[1]}</span><span class="lbl">${x[2]}</span>${x[0]==='queue'&&n?`<span class="n">${n}</span>`:''}</button>`).join('')}<span class="sp"></span><button id="out"><span class="ic">🚪</span><span class="lbl">Se déconnecter</span></button></nav><div class="main"><div class="top"><h1>${TITLES[TAB]}</h1><input class="in srch" id="gs" placeholder="Rechercher : nom, téléphone, e-mail, mission…  ( / )"></div><main id="main"></main></div></div>`;
  document.querySelectorAll('nav [data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render()});$('#out').onclick=()=>{sessionStorage.removeItem('jw-admin');TOKEN=null;render()};
  if($('#wb'))$('#wb').onclick=()=>{TAB='settings';render()};
  $('#gs').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())globalSearch(e.target.value.trim())};
  await V[TAB]($('#main'));
}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#gs')){e.preventDefault();$('#gs').focus()}});
const table=(cols,rows,empty='Aucun résultat.')=>rows.length?`<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:`<div class="empty">${empty}</div>`;
const ST={SUCCESS:['ok','Validé'],FAILED:['no','Refusé'],PENDING_ADMIN:['w','À traiter'],PENDING:['w','En cours'],approved:['ok','Approuvée'],pending:['w','À approuver'],rejetee:['no','Refusée'],none:['gr','Non vérifiée'],verified:['ok','Vérifiée'],rejected:['no','Refusée'],attente:['','Ouverte'],cours:['w','En cours'],terminee:['w','Preuves à valider'],payee:['ok','Payée'],annulee:['no','Annulée'],accepted:['ok','Retenue'],declined:['gr','Non retenue'],withdrawn:['gr','Retirée']};
const chip=s=>{const [c,l]=ST[s]||['',s];return `<span class="chip ${c}">${l}</span>`};
const areaChart=(d,col,fmt=x=>x)=>{const W=600,H=150,P=18,m=Math.max(1,...d.map(x=>x.v)),pts=d.map((x,i)=>[P+i*(W-2*P)/(d.length-1),H-P-(x.v/m)*(H-2*P)]);const line=pts.map(p=>p.join(',')).join(' ');return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="g${col.slice(1)}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="${P},${H-P} ${line} ${W-P},${H-P}" fill="url(#g${col.slice(1)})"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="legend"><span>${d[0].day}</span><b>Max : ${fmt(m)}</b><span>${d[d.length-1].day}</span></div>`};
const V={};
V.dash=async m=>{const s=await api('/stats');const k=(ic,l,v,o={})=>`<div class="k ${o.warn&&o.n?'warn':''} ${o.go?'act':''}" ${o.go?`data-go="${o.go}"`:''}><div class="ico">${ic}</div><div><small>${l}</small><b>${v}</b></div></div>`;
  const mx=Math.max(1,s.missions.pending,s.missions.open,s.missions.inProgress,s.missions.paid,s.missions.rejected),fn=(l,v)=>`<div><span>${l}</span><span><i style="width:${v/mx*100}%"></i></span><b>${v}</b></div>`;
  m.innerHTML=`<div class="cards">${k('📋','Missions à approuver',s.queue.missions,{warn:1,n:s.queue.missions,go:'queue'})}${k('💰','Dépôts à valider',s.queue.deposits,{warn:1,n:s.queue.deposits,go:'queue'})}${k('📤','Retraits à payer',s.queue.withdrawals,{warn:1,n:s.queue.withdrawals,go:'queue'})}${k('🪪','Identités à vérifier',s.queue.kyc,{warn:1,n:s.queue.kyc,go:'queue'})}</div>
  <div class="cards">${k('👥','Utilisateurs',s.users.total)}${k('🆕','Nouveaux (7 j)',s.users.new7)}${k('✅','Vérifiés',s.users.verified)}${k('🚫','Bannis',s.users.suspended)}${k('⭐','Note moyenne réalisateurs',s.reviews.avg?String(s.reviews.avg).replace('.',','):'—')}${k('⚠️','Avis 1-2 étoiles',s.reviews.low,{go:'reviews'})}</div>
  <div class="cards">${k('🟢','Missions ouvertes',s.missions.open)}${k('🛠️','En cours',s.missions.inProgress)}${k('🏁','Payées',s.missions.paid)}${k('💵','Volume payé',F(s.missions.volume))}</div>
  <div class="cards">${k('👛','Soldes des portefeuilles',F(s.money.walletTotal))}${k('⬇️','Total déposé',F(s.money.deposited))}${k('⬆️','Total retiré',F(s.money.withdrawn))}${k('🏦','Commissions J-WIN',F(s.money.fees))}</div>
  <div class="grid2"><div class="box"><h3>Inscriptions (30 jours)</h3>${areaChart(s.signups,'#2563eb')}</div><div class="box"><h3>Volume de missions payées (30 jours)</h3>${areaChart(s.volume,'#16a34a',F)}</div></div>
  <div class="grid2"><div class="box"><h3>Parcours des missions</h3><div class="funnel">${fn('À approuver',s.missions.pending)}${fn('Ouvertes',s.missions.open)}${fn('En cours / preuves',s.missions.inProgress)}${fn('Payées',s.missions.paid)}${fn('Refusées',s.missions.rejected)}</div></div><div class="box"><h3>Activité récente</h3><ul class="feed">${s.recent.map(r=>`<li><span>${{user:'👤',mission:'📋',pay:'💸'}[r.k]}</span><span>${esc(r.x)}</span><small>${dt(r.t)}</small></li>`).join('')||'<li class="empty">Rien pour le moment.</li>'}</ul></div></div>`;
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{TAB=b.dataset.go;render()})};
V.queue=async m=>{const [mi,pa,us]=await Promise.all([api('/missions?mod=pending'),api('/payments?status=PENDING_ADMIN'),api('/users?kyc=pending&limit=50')]);const mp=mi.rows.filter(x=>x.status!=='annulee');
  m.innerHTML=`<div class="box"><h3>Missions à approuver (${mp.length})</h3>${missionsTable(mp)}</div><div class="box"><h3>Dépôts et retraits à traiter (${pa.rows.length})</h3>${paymentsTable(pa.rows)}</div><div class="box"><h3>Identités à vérifier (${us.total})</h3><p class="sub">Ouvrez la fiche pour voir la pièce et le selfie.</p>${usersTable(us.rows)}</div>`;bind(m)};
const missionsTable=r=>table(['Mission','Créateur','Lieu','Montant','Avancement',''],r.map(x=>`<tr><td><b>${esc(x.title)}</b><br><small>${esc(x.id)} · ${esc(x.cat)}</small></td><td>${esc(x.creator)}<br><small>${esc(x.creator_phone||'')}</small></td><td>${x.mode==='remote'?'À distance':esc(x.city+' '+(x.place||''))}</td><td>${F(x.amount)}<br><small>WIN ${x.win}</small></td><td>${chip(x.mod==='pending'?'pending':x.mod==='rejetee'?'rejetee':x.status)}${x.applicants?`<br><small>${x.applicants} candidat(s)</small>`:''}${x.executor?`<br><small>Réalisé par ${esc(x.executor)}</small>`:''}${x.has_proof&&x.status==='terminee'?'<br><small>📎 preuves envoyées</small>':''}</td><td style="white-space:nowrap"><button class="btn g sm" data-a="mview" data-id="${esc(x.id)}">Détail</button> ${x.mod==='pending'&&x.status!=='annulee'?`<button class="btn ok sm" data-a="mok" data-id="${esc(x.id)}">Approuver</button> <button class="btn no sm" data-a="mno" data-id="${esc(x.id)}">Refuser</button>`:''}</td></tr>`));
const paymentsTable=r=>table(['Date','Client','Type','Montant','Détail','Statut',''],r.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.name||'')}<br><small>${esc(x.uphone||'')}</small></td><td>${x.kind==='recharge'?'Dépôt':'Retrait'}<br><small>${esc(x.ref||'')}</small></td><td>${F(x.amount)}<br><small>frais ${F(x.fee)} · ${x.kind==='recharge'?'à recevoir '+F(x.amount+x.fee):'à envoyer '+F(x.amount-x.fee)}</small></td><td><small>${esc(x.method)} ${esc(x.phone||'')}${x.tx_id?'<br>Trans. '+esc(x.tx_id):''}${x.error?'<br>'+esc(x.error):''}</small></td><td>${chip(x.status)}</td><td style="white-space:nowrap">${x.status==='PENDING_ADMIN'?`<button class="btn ok sm" data-a="pok" data-id="${esc(x.id)}">${x.kind==='recharge'?'Valider':'J\'ai payé'}</button> <button class="btn no sm" data-a="pno" data-id="${esc(x.id)}">Refuser</button>`:''}</td></tr>`));
const usersTable=r=>table(['Utilisateur','Contact','Identité','Notes','Solde','Missions',''],r.map(u=>`<tr><td><div class="who"><span class="avatar">${ini(u.prenoms+' '+u.nom)}</span><div><b>${esc(u.prenoms)} ${esc(u.nom)}</b> ${u.status==='suspended'?'<span class="chip no">Banni</span>':''}<br><small>Inscrit le ${dt(u.created_at)}</small></div></div></td><td>${esc(u.phone||'—')}<br><small>${esc(u.email||'')}</small></td><td>${chip(u.kyc_status)}</td><td><small>Réalisateur</small> ${stars(u.rExec||{})}<br><small>Créateur</small> ${stars(u.rCreator||{})}</td><td>${F(u.balance)}</td><td>${u.created} créées<br>${u.done} réalisées</td><td><button class="btn g sm" data-a="user" data-id="${esc(u.id)}">Gérer</button></td></tr>`));
function bind(m){m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a,id=b.dataset.id,enc=encodeURIComponent(id);
  if(a==='user')return userDlg(id);if(a==='mview')return missionDlg(id);
  const note=(a==='mno'||a==='pno')?prompt('Motif (facultatif, transmis à l\'utilisateur) :')??null:'';if(note===null)return;
  if(a==='mcx'&&!confirm('Annuler cette mission ? Le créateur et le réalisateur en seront informés.'))return;
  if(a==='pok'&&!confirm('Confirmez : la réception (dépôt) ou l\'envoi (retrait) est bien effectué ?'))return;
  const map={mok:'/missions/'+enc+'/approve',mno:'/missions/'+enc+'/reject',mcx:'/missions/'+enc+'/cancel',pok:'/payments/'+enc+'/approve',pno:'/payments/'+enc+'/reject'}[a];
  const r=await act(()=>api(map,{body:{note}}),'Fait. L\'utilisateur est prévenu.');if(r){dlg.close();render()}})}
const dlg=$('#dlg');

V.users=async m=>{m.innerHTML=`<div class="tb"><input class="in" id="q" placeholder="Nom, téléphone, e-mail, identifiant" style="min-width:260px"><select class="in" id="k"><option value="">Toutes identités</option><option value="none">Non vérifiées</option><option value="pending">À vérifier</option><option value="verified">Vérifiées</option><option value="rejected">Refusées</option></select><select class="in" id="s"><option value="">Tous statuts</option><option value="suspended">Bannis</option></select><button class="btn" id="go">Rechercher</button></div><div class="box" id="res"></div>`;

async function userDlg(id){const d=await api('/users/'+encodeURIComponent(id)),u=d.user;

  <p>📱 ${esc(u.phone||'—')} · ✉️ ${esc(u.email||'—')} · né(e) le ${esc(u.dob||'')}<br>📍 ${esc(u.adresse||'')} · inscrit le ${dt(u.created_at)}</p>

  <div class="box"><h3>Note interne (visible par vous seul)</h3><textarea class="in" id="nt" rows="2">${esc(u.admin_note||'')}</textarea><p style="text-align:right;margin:8px 0 0"><button class="btn g sm" id="ntb">Enregistrer la note</button></p></div>

  <h3 style="margin-top:14px">Missions</h3>${table(['Mission','Rôle','Montant','Statut'],d.missions.map(x=>`<tr><td>${esc(x.title)}<br><small>${esc(x.id)}</small></td><td>${x.creator_id===u.id?'Créateur':'Réalisateur'}</td><td>${F(x.amount)}</td><td>${chip(x.mod==='pending'?'pending':x.status)}</td></tr>`),'Aucune mission.')}
  <h3 style="margin-top:14px">Mouvements</h3>${table(['Date','Type','Montant','Détail'],d.ledger.slice(0,30).map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(x.kind)}</td><td style="color:${x.amount<0?'var(--red)':'var(--ok)'}">${x.amount>0?'+':''}${F(x.amount)}</td><td>${esc(x.memo||'')}</td></tr>`),'Aucun mouvement.')}
  <p style="text-align:right"><button class="btn g" onclick="dlg.close()">Fermer</button></p>`;dlg.showModal();
  dlg.querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{const r=await fetch('/api/admin/kyc/'+encodeURIComponent(id)+'/'+b.dataset.doc,{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)return toast((await r.json().catch(()=>({}))).error||'Fichier introuvable');$('#docv').innerHTML='<img src="'+URL.createObjectURL(await r.blob())+'" style="max-width:100%;border-radius:12px;margin-top:8px" alt="Pièce">'});

async function missionDlg(id){const d=await api('/missions/'+encodeURIComponent(id)+'/detail'),m=d.mission,pp=(u)=>u?`<b>${esc(u.name)}</b><br><small>📱 ${esc(u.phone||'—')} · ✉️ ${esc(u.email||'—')}</small>`:'<small>—</small>';

  ${m.exec_rating||m.rating?`<h3 style="margin:14px 0 6px">Avis</h3><div class="grid2"><div class="pf"><small>Créateur → réalisateur</small>${m.exec_rating?`<span class="star">${'★'.repeat(m.exec_rating)}</span> ${esc(m.exec_review||'')}<button class="btn g sm" data-rm="exec">Supprimer cet avis</button>`:'—'}</div><div class="pf"><small>Réalisateur → créateur</small>${m.rating?`<span class="star">${'★'.repeat(m.rating)}</span> ${esc(m.review||'')}<button class="btn g sm" data-rm="creator">Supprimer cet avis</button>`:'—'}</div></div>`:''}

  <div class="tb" style="margin-top:14px">${m.mod==='pending'&&m.status!=='annulee'?`<button class="btn ok" data-a="mok" data-id="${esc(m.id)}">Approuver</button><button class="btn no" data-a="mno" data-id="${esc(m.id)}">Refuser</button>`:''}${!['payee','annulee'].includes(m.status)?`<button class="btn g" data-a="mcx" data-id="${esc(m.id)}">Annuler la mission</button>`:''}<span style="flex:1"></span><button class="btn g" onclick="dlg.close()">Fermer</button></div>`;dlg.showModal();bind(dlg);
  dlg.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement cet avis ? La note sera recalculée.'))return;const r=await act(()=>api('/reviews/'+encodeURIComponent(m.id)+'/remove',{body:{which:b.dataset.rm}}),'Avis supprimé.');if(r.ok)missionDlg(id)})}

  m.innerHTML=`<p class="sub">Ces réglages s'appliquent immédiatement, sans redéployer.</p><div class="grid2"><div class="box"><h3>Annonce et maintenance</h3><div class="f"><label>Bandeau d'annonce (affiché en haut de l'application)</label><textarea class="in" data-k="banner" rows="3">${esc(v.banner)}</textarea><small style="color:var(--mut)">Laissez vide pour le retirer.</small></div><label><input type="checkbox" data-k="maintenance" ${v.maintenance?'checked':''}> Mode maintenance (bloque l'application, la console reste accessible)</label></div>
  <div class="box"><h3>Frais et limites</h3>${inp('fees.recharge','Frais de dépôt (%)','number')}${inp('fees.withdraw','Frais de retrait (%)','number')}${inp('fees.mission','Commission sur mission (%)','number')}${inp('plan.create','Offre Standard : missions créées / période','number')}${inp('plan.do','Offre Standard : missions réalisées / période','number')}${inp('plan.unverified','Sans vérification d\'identité : missions créées et réalisées (maximum)','number')}${inp('limits.rechargeMin','Dépôt minimum (F)','number')}${inp('limits.withdrawMin','Retrait minimum (F)','number')}</div>
  <div class="box"><h3>Contacts et paiements</h3>${inp('adminOm','Numéro Orange Money des dépôts')}${inp('adminEmail','E-mail administrateur (reçoit les alertes)')}${inp('adminPhone','Téléphone administrateur (alertes SMS)')}${inp('company.contact','Contact affiché sur les factures')}<div class="f"><label>Mode de paiement</label><select class="in" data-k="paymentMode"><option value="manual" ${v.paymentMode==='manual'?'selected':''}>Manuel (validation par l'administrateur)</option><option value="cinetpay" ${v.paymentMode==='cinetpay'?'selected':''}>Automatique (CinetPay)</option></select></div><div class="f"><label>Vérification d'identité</label><select class="in" data-k="kycMode"><option value="auto" ${v.kycMode==='auto'?'selected':''}>Automatique</option><option value="manual" ${v.kycMode==='manual'?'selected':''}>Validation manuelle par l'administrateur</option></select></div></div>
  <div class="box"><h3>Accès administrateur</h3><p class="sub">Changez le nom d'utilisateur et le mot de passe de cette console (8 caractères minimum, avec une lettre et un chiffre).</p><div class="f"><label>Nouveau nom d'utilisateur</label><input class="in" id="cuUser" autocomplete="off"></div><div class="f"><label>Mot de passe actuel</label><input class="in" id="cuCur" type="password" autocomplete="current-password"></div><div class="f"><label>Nouveau mot de passe</label><input class="in" id="cuNew" type="password" autocomplete="new-password"></div><div class="f"><label>Confirmer</label><input class="in" id="cuNew2" type="password" autocomplete="new-password"></div><button class="btn g" id="cuBtn">Changer l'accès</button></div></div><button class="btn" id="save">Enregistrer les réglages</button>`;
  $('#save').onclick=async()=>{const b={};m.querySelectorAll('[data-k]').forEach(e=>{b[e.dataset.k]=e.type==='checkbox'?e.checked:e.value});await act(()=>api('/settings',{method:'PUT',body:b}),'Réglages enregistrés.')};
  $('#cuBtn').onclick=async()=>{if($('#cuNew').value!==$('#cuNew2').value)return toast('Les deux mots de passe ne correspondent pas.');const r=await act(()=>api('/credentials',{body:{user:$('#cuUser').value,current:$('#cuCur').value,password:$('#cuNew').value}}),'Accès modifié. Reconnectez-vous avec vos nouveaux identifiants.');if(r.ok){setTimeout(()=>{sessionStorage.removeItem('jw-admin');TOKEN=null;render()},1500)}}};
V.exports=async m=>{const ex=[['users','Utilisateurs'],['missions','Missions'],['ledger','Mouvements de portefeuille'],['payments','Dépôts et retraits'],['invoices','Factures'],['audit','Journal d\'audit']];
  m.innerHTML=`<div class="box"><h3>Extractions (CSV, s'ouvre dans Excel)</h3><div class="tb"><label>Du <input class="in" type="date" id="d1"></label><label>Au <input class="in" type="date" id="d2"></label></div>${table(['Données',''],ex.map(e=>`<tr><td>${e[1]}</td><td><button class="btn sm" data-x="${e[0]}">Télécharger</button></td></tr>`))}</div><div class="box"><h3>Sauvegarde complète</h3><p>Copie de toute la base (comptes, portefeuilles, missions, messages, factures). À faire régulièrement et à conserver hors du serveur.</p><button class="btn" id="bk">Télécharger la sauvegarde (.db)</button></div>`;
  const dl=async(p,name)=>{try{const r=await fetch('/api/admin'+p,{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error((await r.json()).error);const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();toast('Téléchargement lancé.')}catch(e){toast(e.message)}};
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>dl(`/export/${b.dataset.x}?from=${$('#d1').value}&to=${$('#d2').value}`,`jwin-${b.dataset.x}.csv`));$('#bk').onclick=()=>dl('/backup','jwin-sauvegarde.db')};
V.system=async m=>{const [s,a]=await Promise.all([api('/system'),api('/audit')]);const row=(k,v)=>`<tr><td>${k}</td><td>${v}</td></tr>`,yn=b=>b?'<span class="chip ok">Oui</span>':'<span class="chip no">Non</span>';
  m.innerHTML=`<div class="grid2"><div class="box"><h3>État du serveur</h3><table>${row('Adresse publique',esc(s.publicUrl))}${row('Node',esc(s.node))}${row('En marche depuis (h)',s.uptimeH)}${row('Base de données',(s.dbSize/1048576).toFixed(2)+' Mo')}${row('Écriture en base',s.dbWritable===true?'<span class="chip ok">Oui</span>':'<span class="chip no">Non : '+esc(s.dbWritable)+'</span>')}${row('Fichiers de missions',s.uploads.n+' ('+(s.uploads.size/1048576).toFixed(1)+' Mo)')}${row('Envoi d\'e-mails configuré',yn(s.smtp)+' '+esc(s.smtpUser||''))}${row('SMS',esc(s.sms))}${row('OCR pièce d\'identité',yn(s.ocr))}${row('Paiement',esc(s.paymentMode))}${row('Identité',esc(s.kycMode))}${row('Maintenance',yn(s.maintenance))}</table></div><div class="box"><h3>Tester les envois</h3><div class="f"><label>Envoyer un e-mail de test à</label><input class="in" id="te" value="${esc(s.adminEmail)}"></div><button class="btn sm" id="bte">Envoyer l'e-mail</button><div class="f" style="margin-top:14px"><label>Envoyer un SMS de test au</label><input class="in" id="ts" placeholder="07 00 00 00 00"></div><button class="btn sm" id="bts">Envoyer le SMS</button></div></div><div class="box"><h3>Journal des actions d'administration</h3>${table(['Date','Action','Cible','Détail'],a.rows.map(x=>`<tr><td>${dt(x.at)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td><td><small>${esc(x.detail)}</small></td></tr>`))}</div>`;
  $('#bte').onclick=async()=>{const r=await act(()=>api('/system/test-email',{body:{to:$('#te').value}}));if(r.to)toast(r.sent?'E-mail envoyé à '+r.to:'Échec : vérifiez SMTP_USER et SMTP_PASS')};
  $('#bts').onclick=async()=>{const r=await act(()=>api('/system/test-sms',{body:{phone:$('#ts').value}}));if(r.to)toast(r.sent?'SMS envoyé':'Échec : vérifiez Twilio')}};
render();
</script></body></html>
